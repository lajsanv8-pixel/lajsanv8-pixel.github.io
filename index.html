<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алхимия жизни ~ Пятый элемент</title>
    <!-- Подключение шрифтов Cormorant Garamond и Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-emerald: #102C28;
            --bg-dark: #0A1E1B;
            --ivory: #F1EBDD;
            --gold: #C6A66B;
            --gold-light: #E0C286;
            --sage: #839D8E;
            --border-gold: rgba(198, 166, 107, 0.25);
            --card-bg: rgba(16, 44, 40, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--ivory);
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            line-height: 1.8;
            background-image: radial-gradient(circle at 50% 0%, var(--bg-emerald) 0%, var(--bg-dark) 75%);
            min-height: 100vh;
        }

        h1, h2, h3, .serif {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        a {
            color: var(--gold);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        a:hover {
            color: var(--gold-light);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 25px;
        }

        /* --- Шапка --- */
        header {
            padding: 30px 0;
            border-bottom: 1px solid var(--border-gold);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 30, 27, 0.85);
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--ivory);
        }

        .logo span {
            color: var(--gold);
            font-style: italic;
            text-transform: none;
        }

        .nav-link-btn {
            border: 1px solid var(--border-gold);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ivory);
        }

        .nav-link-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* --- Главный экран --- */
        .hero {
            padding: 110px 0 80px;
            text-align: center;
        }

        .hero-subtitle {
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--sage);
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 3.6rem;
            line-height: 1.15;
            margin-bottom: 25px;
            color: var(--ivory);
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 620px;
            margin: 0 auto 40px;
            color: rgba(241, 235, 221, 0.8);
            font-weight: 300;
        }

        .btn-gold {
            display: inline-block;
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .btn-gold:hover {
            background: var(--gold);
            color: var(--bg-dark);
            box-shadow: 0 4px 25px rgba(198, 166, 107, 0.25);
        }

        /* --- Концепция / О проекте --- */
        .about {
            padding: 90px 0;
            border-top: 1px solid var(--border-gold);
        }

        .section-title {
            font-size: 2.4rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .gold-quote {
            text-align: center;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px 20px;
            border-top: 1px solid var(--border-gold);
            border-bottom: 1px solid var(--border-gold);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-style: italic;
            color: var(--gold);
            line-height: 1.6;
        }

        .concept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .concept-card {
            background: var(--card-bg);
